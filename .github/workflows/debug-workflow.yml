name: Debug workflow YAML

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

steps:
      - name: Checkout repository
        uses: actions/checkout@v4

- name: Print scrape.yml with line numbers
        run: |
          echo "===== scrape.yml with line numbers ====="
          nl -ba .github/workflows/scrape.yml

- name: Show invisible characters
        run: |
          echo "===== Invisible characters marked with $ ====="
          sed -n 'l' .github/workflows/scrape.yml

- name: Check indentation
        run: |
          echo "===== Lines beginning with a hyphen ====="
          grep -n '^[[:space:]]*-' .github/workflows/scrape.yml || true

- name: Check tabs
        run: |
          if grep -n $'\t' .github/workflows/scrape.yml; then
            echo "ERROR: Tabs found in scrape.yml"
            exit 1
          else
            echo "No tabs found"
          fi
